        <button class="biz-tab active" onclick="selectBusiness('Agricultural Enterprise')" id="tabAgri">

        </button>

        <button class="biz-tab" onclick="selectBusiness('Retail')" id="tabRetail">

        <button class="biz-tab" onclick="selectBusiness('Manufacturing')" id="tabManu">

          <span id="tabManuText"></span>
        </button>

        <div class="col-md-6">

          <input class="neon-input" id="last_name" placeholder="Enter last name">
        </div>

        <div class="col-md-4">
          <label class="field-label" id="lblPhone"></label>
          <input class="neon-input" id="phone" placeholder="10-digit mobile">
        </div>

        <div class="col-md-4">
          <label class="field-label" id="lblState"></label>
          <input class="neon-input" id="state" placeholder="State">
        </div>

        <div class="col-md-4">
          <label class="field-label" id="lblDistrict"></label>
          <input class="neon-input" id="district" placeholder="District">
        </div>

      <!-- DYNAMIC BUSINESS FORM -->

        <span class="section-dot"></span>
        <span id="domainSectionTitle"></span>

      <!-- AGRI -->

          <div class="col-md-4">
            <label class="field-label" id="lblIrrigation"></label>

              <option>Canal</option>
              <option>Borewell</option>
              <option>Rainfed</option>

          </div>

<!-- ========================= JS ========================= -->
<script>
let selectedBusiness = "Agricultural Enterprise";

function selectBusiness(type){
  selectedBusiness = type;

  // Tabs active
  document.querySelectorAll(".biz-tab").forEach(b=>b.classList.remove("active"));
  if(type==="Agricultural Enterprise") document.getElementById("tabAgri").classList.add("active");
  if(type==="Retail") document.getElementById("tabRetail").classList.add("active");
  if(type==="Manufacturing") document.getElementById("tabManu").classList.add("active");
  if(type==="Trading") document.getElementById("tabTrade").classList.add("active");

  // Indicator
  const active = document.querySelector(".biz-tab.active");
  const indicator = document.getElementById("bizIndicator");
  indicator.style.width = active.offsetWidth + "px";
  indicator.style.left = active.offsetLeft + "px";

  // Hide all
  document.querySelectorAll(".domain-box").forEach(d=>d.classList.remove("show"));
  document.getElementById("domainAgri").classList.remove("show");
  document.getElementById("domainRetail").classList.remove("show");
  document.getElementById("domainManu").classList.remove("show");
  document.getElementById("domainTrade").classList.remove("show");

  // Show selected
  if(type==="Agricultural Enterprise") document.getElementById("domainAgri").classList.add("show");
  if(type==="Retail") document.getElementById("domainRetail").classList.add("show");
  if(type==="Manufacturing") document.getElementById("domainManu").classList.add("show");
  if(type==="Trading") document.getElementById("domainTrade").classList.add("show");

  // Theme
  const shell = document.getElementById("formShell");
  shell.classList.remove("theme-agri","theme-retail","theme-manu","theme-trade");

  if(type==="Agricultural Enterprise") shell.classList.add("theme-agri");
  if(type==="Retail") shell.classList.add("theme-retail");
  if(type==="Manufacturing") shell.classList.add("theme-manu");
  if(type==="Trading") shell.classList.add("theme-trade");
}

function predictRisk(){
  const bank = document.getElementById("bank_name").value.trim();
  const agree = document.getElementById("agree").checked;

  if(!bank){
    document.getElementById("result").innerHTML =
      "<div class='danger'>⚠️ Bank Name is required to submit this loan request.</div>";
    return;
  }
  if(!agree){
    document.getElementById("result").innerHTML =
      "<div class='danger'>⚠️ Please accept the agreement to continue.</div>";
    return;
  }

  const payload = {
    business_type: selectedBusiness,
    bank_name: bank,
    bank_branch: document.getElementById("bank_branch").value,

    first_name: document.getElementById("first_name").value,
    last_name: document.getElementById("last_name").value,
    phone: document.getElementById("phone").value,
    state: document.getElementById("state").value,
    district: document.getElementById("district").value,

    // Agri
    land_size: document.getElementById("land_size").value,
    crop_type: document.getElementById("crop_type").value,
    irrigation: document.getElementById("irrigation").value,
    season: document.getElementById("season").value,
    farmer_category: document.getElementById("farmer_category").value,

    // ESG
    womenLed: document.getElementById("womenLed").checked,
    organicFarm: document.getElementById("organicFarm").checked,
    smallFarmer: document.getElementById("smallFarmer").checked,

    // Retail
    retail_shop_type: document.getElementById("retail_shop_type").value,
    retail_footfall: document.getElementById("retail_footfall").value,
    retail_pos: document.getElementById("retail_pos").value,
    retail_supplier: document.getElementById("retail_supplier").value,

    // Manufacturing
    manu_type: document.getElementById("manu_type").value,
    manu_employees: document.getElementById("manu_employees").value,
    manu_power: document.getElementById("manu_power").value,
    manu_compliance: document.getElementById("manu_compliance").value,

    // Trading
    trade_type: document.getElementById("trade_type").value,
    trade_area: document.getElementById("trade_area").value,
    trade_inventory: document.getElementById("trade_inventory").value,
    trade_transport: document.getElementById("trade_transport").value,

    // Finance
    years_in_operation: document.getElementById("years_in_operation").value,
    annual_revenue: document.getElementById("annual_revenue").value,
    monthly_cashflow: document.getElementById("monthly_cashflow").value,
    loan_amount_requested: document.getElementById("loan_amount_requested").value,
    credit_score: document.getElementById("credit_score").value,
    existing_loans: document.getElementById("existing_loans").value,
    debt_to_income_ratio: document.getElementById("debt_to_income_ratio").value
  };

  document.getElementById("result").innerHTML =
    "<div class='loading'>⏳ AI Engine is evaluating risk & ESG impact...</div>";

  fetch("/predict",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "X-API-KEY":"secure-credit-api-123"
    },
    body: JSON.stringify(payload)
  })
  .then(res=>res.json())
  .then(data=>{
    document.getElementById("result").innerHTML = `
      <div class="ok">
        <div class="res-title">✅ AI Credit Result</div>
        <div class="res-grid">
          <div class="res-item"><span>Risk Score</span><b>${data.risk_score}%</b></div>
          <div class="res-item"><span>Decision</span><b>${data.decision}</b></div>
          <div class="res-item"><span>Confidence</span><b>${data.confidence}</b></div>
          <div class="res-item"><span>ESG Score</span><b>${data.impact_score}</b></div>
          <div class="res-item wide"><span>Recommended Credit Limit</span><b>₹${data.recommended_limit}</b></div>
        </div>
      </div>
    `;
  })
  .catch(()=>{
    document.getElementById("result").innerHTML =
      "<div class='danger'>❌ Server error. Please try again.</div>";
  });
}
</script>
